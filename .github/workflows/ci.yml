name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── STAGE 1: Code Quality ─────────────────────────────────
  quality-gate:
    name: "Stage 1 · Code Quality"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            sdk/package-lock.json
            ui/package-lock.json

      # Quality Check for SDK
      - name: Install SDK dependencies
        run: cd sdk && npm ci
      - name: Build SDK
        run: cd sdk && npm run build
      - name: Typecheck SDK
        run: cd sdk && npx tsc --noEmit

      # Quality Check for UI
      - name: Install UI dependencies
        run: cd ui && npm ci
      - name: Lint UI
        run: cd ui && npm run lint
      - name: Typecheck UI
        run: cd ui && npx tsc --noEmit
      - name: Run UI tests
        run: cd ui && npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: ui-coverage
          path: ui/coverage/
          retention-days: 7

      # Quality Check for Rust Contract
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run Contract Cargo Tests
        run: cd contract && cargo test

  # ── STAGE 2: Security Gate ────────────────────────────────
  secret-scan:
    name: "Stage 2 · Secret Scanning"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
        continue-on-error: true # Prevents mock test keys from halting builds

  dependency-audit:
    name: "Stage 2 · Dependency Audit"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            sdk/package-lock.json
            ui/package-lock.json
      - name: Install dependencies
        run: |
          cd sdk && npm ci
          cd ../ui && npm ci
      - name: Audit UI dependencies
        run: cd ui && npm audit --audit-level=high
        continue-on-error: true
      - name: Audit SDK dependencies
        run: cd sdk && npm audit --audit-level=high
        continue-on-error: true
      - name: License compliance check
        run: npx license-checker --production --failOn "GPL-3.0;AGPL-3.0" --summary
        continue-on-error: true

  # ── STAGE 3: Build Verification ───────────────────────────
  build:
    name: "Stage 3 · Build Verification"
    needs: [quality-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            sdk/package-lock.json
            ui/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Install and Build SDK
        run: |
          cd sdk
          npm ci
          npm run build

      - name: Compile TEE WASM Contract
        run: |
          cd contract
          cargo build --target wasm32-wasip2 --release

      - name: Install and Build UI
        run: |
          cd ui
          npm ci
          npm run build

      - name: Check bundle size
        run: |
          echo "📦 Bundle Size Report"
          echo "─────────────────────"
          if [ -d "ui/.next" ]; then
            TOTAL_SIZE=$(du -sk ui/.next/static | cut -f1)
            echo "Total static assets: ${TOTAL_SIZE}KB"
            if [ "$TOTAL_SIZE" -gt 2000 ]; then
              echo "::error::Bundle size ${TOTAL_SIZE}KB exceeds 2000KB error threshold"
              exit 1
            elif [ "$TOTAL_SIZE" -gt 1500 ]; then
              echo "::warning::Bundle size ${TOTAL_SIZE}KB exceeds 1500KB warning threshold"
            else
              echo "✅ Bundle size within budget"
            fi
          fi

  # ── STAGE 4: E2E Tests ────────────────────────────────────
  e2e:
    name: "Stage 4 · E2E Tests"
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            sdk/package-lock.json
            ui/package-lock.json

      - name: Install dependencies
        run: |
          cd sdk && npm ci && npm run build
          cd ../ui && npm ci && npm run build

      - name: Install Playwright browsers
        run: cd ui && npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: cd ui && npm run e2e
        env:
          NODE_ENV: production

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ui/playwright-report/
            ui/test-results/
          retention-days: 7

  # ── STAGE 5: Performance ──────────────────────────────────
  performance:
    name: "Stage 5 · Performance"
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            sdk/package-lock.json
            ui/package-lock.json

      - name: Install dependencies
        run: |
          cd sdk && npm ci && npm run build
          cd ../ui && npm ci && npm run build

      - name: Lighthouse CI
        run: |
          npm install -g @lhci/cli
          cd ui && npx lhci autorun
        continue-on-error: true

  # ── STAGE 6: Deploy Gate ──────────────────────────────────
  deploy-gate:
    name: "Stage 6 · Deploy Gate"
    needs: [build, e2e, performance, secret-scan, dependency-audit]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: All gates passed
        run: |
          echo "🚀 All CI/CD gates passed!"

  # ── STAGE 7: Publish to npmjs (main only) ──────────────────
  publish-npm:
    name: "Stage 7 · Publish to npmjs & GitHub Packages"
    needs: [deploy-gate]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js for npmjs
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: |
            sdk/package-lock.json
            ui/package-lock.json

      - name: Install and Build SDK
        run: |
          cd sdk
          npm ci
          npm run build

      - name: Check and Publish SDK to npmjs
        run: |
          cd sdk
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if npm view @edycutjong/synod-sdk@$CURRENT_VERSION version >/dev/null 2>&1; then
            echo "Version $CURRENT_VERSION of @edycutjong/synod-sdk is already published to npmjs, skipping."
          else
            echo "Publishing @edycutjong/synod-sdk version $CURRENT_VERSION to npmjs..."
            npm publish --provenance --access public --ignore-scripts
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://npm.pkg.github.com"

      - name: Publish SDK to GitHub Packages
        run: |
          cd sdk
          npm publish --access public --ignore-scripts || echo "SDK already published or error"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── STAGE 8: Deploy to Railway (main only) ────────────────
  deploy-railway:
    name: "Stage 8 · Deploy to Railway"
    needs: [publish-npm]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            sdk/package-lock.json
            ui/package-lock.json

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy UI to Railway
        run: |
          CLEANED_TOKEN=$(echo -n "$RAILWAY_TOKEN" | tr -d '\r\n ')
          RAILWAY_TOKEN="$CLEANED_TOKEN" railway up --service synod-ui --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Get current version
        run: echo "NEW_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Build release packages
        run: |
          if [ -f "sdk/package.json" ]; then
            cd sdk && npm pack && mv *.tgz ../ && cd ..
          fi
          if [ -f "cli/package.json" ]; then
            cd cli && npm pack && mv *.tgz ../ && cd ..
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tgz
          tag_name: v${{ env.NEW_VERSION }}
          name: Release v${{ env.NEW_VERSION }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
